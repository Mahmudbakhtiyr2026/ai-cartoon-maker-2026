<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Cartoon Maker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: auto;
      padding: 20px;
      background: #f3f4f6;
    }

    .box {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
    }

    textarea, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      background: #111827;
      color: white;
      border: none;
    }

    button:disabled {
      opacity: 0.6;
    }

    #result {
      margin-top: 20px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎬 AI Cartoon Maker</h1>

  <p>Сюжети мультфильми худро бо AI соз!</p>

  <textarea
    id="idea"
    rows="5"
    placeholder="Масалан: Ду дӯст ба сайёраи дигар мераванд..."
  ></textarea>

  <select id="language">
    <option value="tg">Тоҷикӣ</option>
    <option value="ru">Русский</option>
    <option value="en">English</option>
  </select>

  <button id="generateButton" onclick="generateStory()">
    ✨ Generate Story
  </button>

  <div id="result"></div>

</div>

<script>

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwOBNL7SiY4vCEyHH1f3HV3lXTtvxCb6HKOgo5alZN54buLTrilBvSkgdzK_7RmLyOfQg/exec";

async function generateStory() {

  const idea = document.getElementById("idea").value.trim();
  const language = document.getElementById("language").value;
  const result = document.getElementById("result");
  const button = document.getElementById("generateButton");

  if (!idea) {
    result.textContent = "Лутфан аввал идеяи мультфильмро навис.";
    return;
  }

  button.disabled = true;
  result.textContent = "⏳ AI кор карда истодааст...";

  try {

    const response = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        idea: idea,
        language: language
      })
    });

    const data = await response.json();

    if (data.success) {
      result.textContent = data.story;
    } else {
      result.textContent =
        "❌ Хато:\n" + (data.error || "Хатои номаълум");
    }

  } catch (error) {

    result.textContent =
      "❌ Пайвастшавӣ ба сервер нашуд.\n\n" +
      error.message;

  } finally {

    button.disabled = false;

  }
}

</script>

</body>
</html>
